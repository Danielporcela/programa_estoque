
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .login-container h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #0f172a;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: #334155;
      font-weight: bold;
    }

    .input-group input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      transition: 0.3s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #121417;
      box-shadow: 0 0 10px rgba(37,99,235,0.2);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #1e2024;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-login:hover {
      background: #0c0c0e;
    }

    .links {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }

    .links a {
      text-decoration: none;
      color: #131415;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .mensagem {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    @media(max-width: 480px) {
      .login-container {
        margin: 20px;
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h1>Login</h1>

    <form id="formLogin">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Digite seu email" required>
      </div>

      <div class="input-group">
        <label>Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>
      </div>

      <button type="submit" class="btn-login">
        Entrar
      </button>

    </form>
  </div>
<script>
  const form = document.getElementById('formLogin');

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;

    if(email === 'supervisor' && senha === 'luciano') {

      window.location.href = '/dashboard';

    } else {

      alert('Email ou senha inválidos!');

    }
  });
</script>

</body>
</html>
