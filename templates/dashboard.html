<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Sistema</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#f1f5f9;
    }

    .topo{
      width:100%;
      background:#0f172a;
      color:white;
      padding:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .topo h1{
      font-size:24px;
    }

    .btn-sair{
      background:#ef4444;
      color:white;
      border:none;
      padding:10px 18px;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
    }

    .btn-sair:hover{
      background:#dc2626;
    }

    .container{
      padding:30px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
    }

    .card{
      background:white;
      padding:25px;
      border-radius:15px;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .card h2{
      margin-bottom:10px;
      color:#0f172a;
    }

    .card p{
      color:#475569;
      margin-bottom:20px;
    }

    .btn{
      display:inline-block;
      background:#2563eb;
      color:white;
      padding:10px 16px;
      border-radius:8px;
      text-decoration:none;
      font-weight:bold;
    }

    .btn:hover{
      background:#1d4ed8;
    }
  </style>
</head>
<body>

  <div class="topo">
    <h1>Painel do Sistema</h1>

    <button class="btn-sair" onclick="sair()">
      Sair
    </button>
   <a href="/estoque" class="btn">
     Estoque
   </a>

  </div>

  <div class="container">

    <div class="cards">

      <div class="card">
        <h2>Usuários</h2>
        <p>Gerenciar usuários do sistema.</p>
        <a href="#" class="btn">Abrir</a>
      </div>

      <div class="card">
        <h2>Relatórios</h2>
        <p>Visualizar relatórios do sistema.</p>
        <a href="#" class="btn">Abrir</a>
      </div>

      <div class="card">
        <h2>Configurações</h2>
        <p>Alterar configurações do sistema.</p>
        <a href="#" class="btn">Abrir</a>
      </div>

      <div class="card">
        <h2>Cadastro</h2>
        <p>Cadastrar novas informações.</p>
        <a href="#" class="btn">Abrir</a>
      </div>

    </div>

  </div>

  <script>
  function sair(){
  window.location.href = "/";
}
  </script>

</body>
</html>
